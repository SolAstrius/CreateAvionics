name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ILLUAMINATE_VERSION: 0.1.0-83-g1131f68

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Generate Lua stubs from @LuaFunction sources
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :common:luaJavadoc --stacktrace

      - name: Download illuaminate
        run: |
          set -euo pipefail
          mkdir -p .bin
          curl -sSLo .bin/illuaminate \
            "https://squiddev.cc/illuaminate/bin/${ILLUAMINATE_VERSION}/illuaminate-linux-x86_64"
          chmod +x .bin/illuaminate
          .bin/illuaminate --version

      - name: Build docs site
        run: .bin/illuaminate doc-gen

      - name: Download per-version doc archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p doc-archives
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'docs-*.tar.gz' --dir doc-archives || true
          done
          ls -la doc-archives/

      - name: Compose versioned site
        run: .github/scripts/compose-docs-site.sh site build/illuaminate doc-archives

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
