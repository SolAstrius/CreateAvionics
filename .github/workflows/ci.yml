name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            neoforge/build/libs/*.jar
            common/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  # One jar is meant to run across every upstream combination our mods.toml
  # ranges accept, so compile against the ends of those ranges rather than only
  # against the versions pinned in gradle.properties. Sable and Simulated are
  # separate downloads and version independently, hence the full cross product
  # rather than two "old" and "new" rows.
  #
  # This proves symbols still resolve. It does NOT prove mixins still apply --
  # a mixin resolves its target by name at apply time, so a moved injection
  # point only fails at launch. Catching that needs a gametest.
  compat:
    name: compile (simulated ${{ matrix.simulated }}, sable ${{ matrix.sable }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Aeronautics and Offroad ship in the same jar as Simulated and share
        # its version, so they track it rather than varying independently.
        simulated: ['1.2.1', '1.3.0']
        sable: ['1.1.1', '2.0.3']
        # sable-companion is jar-in-jar'd inside Sable, so a user never picks
        # it independently -- they get whatever their Sable bundles. Pair them
        # rather than taking the cross product of versions that cannot co-occur.
        include:
          - sable: '1.1.1'
            companion: '1.5.0'
          - sable: '2.0.3'
            companion: '1.6.0'
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # :common:test pulls in compileJava, so this covers both symbol
      # resolution and the reflection tests against each combination.
      - name: Compile and test against upstream combination
        run: |
          ./gradlew :common:test --stacktrace \
            -Psimulated_version=${{ matrix.simulated }} \
            -Paeronautics_version=${{ matrix.simulated }} \
            -Poffroad_version=${{ matrix.simulated }} \
            -Psable_version=${{ matrix.sable }} \
            -Psable_companion_version=${{ matrix.companion }}
