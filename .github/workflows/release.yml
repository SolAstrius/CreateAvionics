name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write
  # Needed to dispatch the Docs workflow after publishing.
  actions: write

env:
  # Runners force Node 24 on 2026-06-16; mc-publish@v3.3 still targets Node 20.
  # Opt in early so a breakage shows up in a test run, not a real release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Keep in sync with docs.yml.
  ILLUAMINATE_VERSION: 0.1.0-83-g1131f68

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Resolve version
        id: vars
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          gradle_version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::Tag version ($version) does not match gradle.properties mod_version ($gradle_version)"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "mc=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)"
          } >>"$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          for jar in neoforge/build/libs/*.jar; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar) continue ;;
            esac
            cp "$jar" release-artifacts/
          done
          ls -la release-artifacts/

      - name: Build docs snapshot
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :common:luaJavadoc --stacktrace

      - name: Download illuaminate
        run: |
          set -euo pipefail
          mkdir -p .bin
          curl -sSLo .bin/illuaminate \
            "https://squiddev.cc/illuaminate/bin/${ILLUAMINATE_VERSION}/illuaminate-linux-x86_64"
          chmod +x .bin/illuaminate
          .bin/illuaminate --version

      - name: Package docs snapshot
        run: |
          .bin/illuaminate doc-gen
          tar -czf "release-artifacts/docs-${{ steps.vars.outputs.tag }}.tar.gz" -C build/illuaminate .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Create: Avionics ${{ steps.vars.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: "${{ contains(steps.vars.outputs.version, '-') }}"
          files: |
            release-artifacts/*.jar
            release-artifacts/docs-*.tar.gz

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.vars.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ && flag { exit }
            flag' CHANGELOG.md > modrinth-changelog.md
          if [ ! -s modrinth-changelog.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${{ steps.vars.outputs.version }}, falling back to tag subject"
            git tag -l --format='%(contents:subject)' "${{ steps.vars.outputs.tag }}" > modrinth-changelog.md
          fi
          cat modrinth-changelog.md

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: h4nsLvjf
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Mod jar only — the javadoc jar must not be uploaded (alphabetical
          # glob order would make it the primary file on Modrinth).
          files: release-artifacts/create_avionics-neoforge-*-${{ steps.vars.outputs.version }}.jar
          name: "Create: Avionics ${{ steps.vars.outputs.version }}"
          version: ${{ steps.vars.outputs.version }}
          version-type: alpha
          loaders: neoforge
          game-versions: ${{ steps.vars.outputs.mc }}
          changelog-file: modrinth-changelog.md
          # Explicit list — auto-detection from mods.toml maps modId
          # "computercraft" to the archived original ComputerCraft project and
          # invents ids for mods without Modrinth pages (Simulated, Offroad).
          dependencies: |
            cc-tweaked(required)
            create(required)
            sable(required)
            create-aeronautics(optional)

      - name: Regenerate updates.json on main
        if: "${{ !contains(steps.vars.outputs.version, '-') }}"
        env:
          MC_VERSION: ${{ steps.vars.outputs.mc }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          python3 - <<'PY'
          import json, os, subprocess
          mc = os.environ['MC_VERSION']
          tags = subprocess.check_output(
              ['git', 'tag', '--list', 'v*', '--sort=v:refname']
          ).decode().split()
          versions = [t[1:] for t in tags if '-' not in t[1:]]
          if not versions:
              raise SystemExit('no stable tags found')
          latest = versions[-1]
          entries = {}
          for v in versions:
              msg = subprocess.check_output(
                  ['git', 'tag', '-l', '--format=%(contents:subject)', f'v{v}']
              ).decode().strip()
              entries[v] = msg or f'Release {v}'
          out = {
              'homepage': 'https://modrinth.com/mod/create-avionics',
              mc: entries,
              'promos': {
                  f'{mc}-recommended': latest,
                  f'{mc}-latest': latest,
              },
          }
          with open('updates.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          PY

          if git diff --quiet -- updates.json; then
            echo 'updates.json unchanged, skipping commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.json
          git commit -m "chore: update updates.json for ${{ steps.vars.outputs.tag }}"
          git push origin main

      # Events caused by GITHUB_TOKEN (the release above, the push to main)
      # do not trigger other workflows, so recompose the docs site explicitly
      # to pick up this release's docs-*.tar.gz archive.
      - name: Recompose docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
